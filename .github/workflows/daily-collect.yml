name: Daily Collect
on:
  schedule:
    - cron: '30 6 * * 1-5'  # 14:30 CST (UTC+8) = 06:30 UTC, Mon-Fri
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily collection pipeline
        run: python scripts/daily_collect.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
          JSONBIN_BIN_CANDIDATES: 6ab9da2cac6210605afc9499
          JSONBIN_BIN_FINAL: 6ab9da2dffd5d16053363048
          JSONBIN_BIN_CONFIG: 6ab9da2eac6210605afc949a
          JSONBIN_BIN_CONFIRM: 6ab9da2effd5d16053363049
          JSONBIN_BIN_HISTORY: 6ab9da36ffd5d16053363060
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          EXCLUDE_SOURCES: erj

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-output-${{ github.run_number }}
          path: data/
